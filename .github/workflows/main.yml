name: Build Alam Aladdad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare HTML Application
        run: |
          mkdir -p www

          HTML_FILE=$(find . -maxdepth 1 -type f -iname '*.html' | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found in repository root."
            exit 1
          fi

          cp "$HTML_FILE" www/index.html

          npm init -y

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          printf '{"appId":"com.alam.aladdad","appName":"Alam Aladdad","webDir":"www"}' > capacitor.config.json

          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Aladdad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
