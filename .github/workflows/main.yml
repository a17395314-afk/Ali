name: Build Alam Aladdad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      -       - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Prepare HTML application
        run: |
          mkdir -p www
          find . -maxdepth 1 -mindepth 1 ! -name .git ! -name .github ! -name www -exec cp -R {} www/ \;
          HTML_FILE=$(find www -maxdepth 1 -type f -iname '*.html' | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "No HTML file found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          printf '{"appId":"com.alam.aladdad","appName":"Alam Aladdad","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Aladdad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
