name: Build Alam Aladdad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare HTML Application
        shell: bash
        run: |
          set -e

          mkdir -p www

          HTML_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.html' | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found in repository root."
            exit 1
          fi

          echo "Using HTML file: $HTML_FILE"
          cp "$HTML_FILE" www/index.html

          npm init -y

          npm install @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          printf '%s\n' \
            '{"appId":"com.alam.aladdad","appName":"عالم العدد","webDir":"www"}' \
            > capacitor.config.json

          npx cap add android

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Alam-Aladdad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
